AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: IBEX Scenario A serverless MVP

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref IbexTable
        SCENARIO_NAME: scenario-a-serverless

Resources:
  IbexApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: ibex-scenario-a-api
      StageName: Prod
      EndpointConfiguration:
        Type: REGIONAL
      Cors:
        AllowMethods: "'GET,POST,PATCH,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"

  IbexApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ibex-scenario-a-api
      CodeUri: src/
      Handler: app.handler
      Description: API serverless de IBEX
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IbexTable
      Events:
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref IbexApi
            Path: /api/health
            Method: GET

        Dashboard:
          Type: Api
          Properties:
            RestApiId: !Ref IbexApi
            Path: /api/dashboard
            Method: GET

        ListCustomers:
          Type: Api
          Properties:
            RestApiId: !Ref IbexApi
            Path: /api/customers
            Method: GET

        CreateCustomer:
          Type: Api
          Properties:
            RestApiId: !Ref IbexApi
            Path: /api/customers
            Method: POST

        UpdateCustomer:
          Type: Api
          Properties:
            RestApiId: !Ref IbexApi
            Path: /api/customers/{id}
            Method: PATCH

        DeleteCustomer:
          Type: Api
          Properties:
            RestApiId: !Ref IbexApi
            Path: /api/customers/{id}
            Method: DELETE

        ListServices:
          Type: Api
          Properties:
            RestApiId: !Ref IbexApi
            Path: /api/services
            Method: GET

        CreateService:
          Type: Api
          Properties:
            RestApiId: !Ref IbexApi
            Path: /api/services
            Method: POST

        UpdateService:
          Type: Api
          Properties:
            RestApiId: !Ref IbexApi
            Path: /api/services/{id}
            Method: PATCH

        DeleteService:
          Type: Api
          Properties:
            RestApiId: !Ref IbexApi
            Path: /api/services/{id}
            Method: DELETE

        ListSales:
          Type: Api
          Properties:
            RestApiId: !Ref IbexApi
            Path: /api/sales
            Method: GET

        CreateSale:
          Type: Api
          Properties:
            RestApiId: !Ref IbexApi
            Path: /api/sales
            Method: POST

        UpdateSale:
          Type: Api
          Properties:
            RestApiId: !Ref IbexApi
            Path: /api/sales/{id}
            Method: PATCH

        DeleteSale:
          Type: Api
          Properties:
            RestApiId: !Ref IbexApi
            Path: /api/sales/{id}
            Method: DELETE

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256


  IbexTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ibex-scenario-a-data
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

Outputs:
  ApiUrl:
    Description: URL de API Gateway para el Escenario A
    Value: !Sub "https://${IbexApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"

  FrontendBucketName:
    Description: Bucket privado del frontend IBEX
    Value: !Ref FrontendBucket


  TableName:
    Description: Nombre de la tabla DynamoDB
    Value: !Ref IbexTable
