AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: IBEX Scenario A serverless MVP

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 10
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Ref IbexTable
        SCENARIO_NAME: scenario-a-serverless

Resources:
  IbexApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: ibex-scenario-a-api
      StageName: Prod
      EndpointConfiguration:
        Type: REGIONAL

  IbexApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ibex-scenario-a-api
      CodeUri: src/
      Handler: app.handler
      Description: API serverless básica para IBEX
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IbexTable
      Events:
        HealthEndpoint:
          Type: Api
          Properties:
            RestApiId: !Ref IbexApi
            Path: /health
            Method: GET

  IbexTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ibex-scenario-a-data
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

Outputs:
  ApiUrl:
    Description: URL de API Gateway para el Escenario A
    Value: !Sub "https://${IbexApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"

  TableName:
    Description: Nombre de la tabla DynamoDB
    Value: !Ref IbexTable
